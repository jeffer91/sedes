name: Audit Firebase backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backend-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Test Firestore public access
        shell: bash
        run: |
          set +e
          API_KEY="AIzaSyCaHf1C0BB0X_H3BDZ1o-UDAsPmLTjsZLA"
          BASE="https://firestore.googleapis.com/v1/projects/utet-4387a/databases/(default)/documents"

          test_get () {
            label="$1"
            url="$2"
            code=$(curl -sS -o /tmp/body.json -w "%{http_code}" "$url?key=$API_KEY")
            echo "=== $label ==="
            echo "HTTP $code"
            python -c 'import json; d=json.load(open("/tmp/body.json")); print(("ERROR: "+str(d.get("error",{}).get("status"))+" - "+str(d.get("error",{}).get("message"))) if isinstance(d,dict) and "error" in d else ("documents: "+str(len(d.get("documents",[]))) if isinstance(d,dict) and "documents" in d else "OK"))'
          }

          test_get "Estudiante get" "$BASE/Estudiante/1500522055"
          test_get "Matriculas list" "$BASE/matriculas"
          test_get "Respuestas list" "$BASE/eleccionSedeComplexivo"

      - name: Inspect Firebase Auth account/provider
        shell: bash
        run: |
          set +e
          API_KEY="AIzaSyCaHf1C0BB0X_H3BDZ1o-UDAsPmLTjsZLA"
          code=$(curl -sS -o /tmp/auth.json -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -d '{"identifier":"0401135306@itsqmet.edu.ec","continueUri":"https://jeffer91.github.io/sedes/administrador/"}' \
            "https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key=$API_KEY")
          echo "=== Firebase Auth ==="
          echo "HTTP $code"
          python -c 'import json; d=json.load(open("/tmp/auth.json")); print("ERROR: "+str(d.get("error",{}).get("message")) if "error" in d else "registered="+str(d.get("registered"))+" signin_methods="+str(d.get("signinMethods"))+" provider_id="+str(d.get("providerId")))'
